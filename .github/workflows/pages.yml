name: deploy live demo

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "web/**"
      - "cmd/qsgo/**"
      - "*.go"
      - "go.mod"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/configure-pages@v6
      - name: Build the actual CLI for WebAssembly
        shell: bash
        run: |
          mkdir -p _site
          cp web/index.html web/styles.css web/app.js _site/
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" _site/
          GOOS=js GOARCH=wasm go build -trimpath -o _site/qsgo.wasm ./cmd/qsgo
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
